<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Night</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script>
// Old QR codes pointed at the site root with ?join=CODE — send those phones to the Jeopardy buzzer.
(function(){try{var c=new URLSearchParams(location.search).get('join');if(c)location.replace('jeopardy.html?join='+encodeURIComponent(c))}catch(e){}})();
</script>
<style>
:root{--gold:#ffcc33;--line:rgba(255,255,255,.14)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;color:#fff;font-family:Inter,system-ui,sans-serif;background:#04061f}
body{background:radial-gradient(ellipse at 20% -10%,#3a1fb8 0%,transparent 50%),radial-gradient(ellipse at 90% 10%,#0b5fa8 0%,transparent 45%),#04061f;min-height:100vh}
.disp{font-family:Oswald,Impact,'Arial Narrow',sans-serif;text-transform:uppercase;letter-spacing:.02em}
.wrap{max-width:1100px;margin:0 auto;padding:36px 18px 60px}
h1{font-size:clamp(48px,9vw,104px);margin:0;line-height:1;text-shadow:4px 4px 0 #000}
h1 span{color:var(--gold)}
.sub{color:#c4cbff;margin:8px 0 28px;font-size:17px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.game{position:relative;display:flex;flex-direction:column;gap:10px;padding:20px;border-radius:18px;border:1px solid var(--line);color:#fff;text-decoration:none;min-height:230px;overflow:hidden;transition:transform .15s,box-shadow .15s}
.game:hover{transform:translateY(-4px);box-shadow:0 14px 40px rgba(0,0,0,.45)}
.game .art{font-size:44px;line-height:1}
.game h2{margin:0;font-size:34px;text-shadow:3px 3px 0 #000}
.game p{margin:0;color:#e4e7ff;line-height:1.45;font-size:15px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.tag{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.2)}
.play{position:absolute;top:18px;right:18px;background:var(--gold);color:#1a1300;font-weight:700;border-radius:999px;padding:6px 14px;font-size:14px}
.soon{border-style:dashed;background:rgba(255,255,255,.04);align-items:center;justify-content:center;text-align:center;color:#aab4ef}
.soon:hover{transform:none;box-shadow:none}
.join{margin-top:32px;background:rgba(10,20,110,.6);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.join h3{margin:0 18px 0 0;font-size:24px;color:var(--gold)}
.join input{padding:12px 14px;border-radius:10px;border:2px solid var(--gold);font-size:20px;width:150px;text-align:center;text-transform:uppercase;letter-spacing:.25em;font-weight:700}
.btn{background:linear-gradient(#ffd85a,#f0b400);color:#1a1300;border:0;border-radius:10px;padding:12px 22px;font-weight:700;font-size:16px;cursor:pointer;box-shadow:0 3px 0 #a87b00;font-family:inherit}
.muted{color:#aab4ef;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <h1 class="disp">Game <span>Night</span></h1>
  <div class="sub">Pick a game for the big screen. Players join on their phones.</div>
  <div class="grid" id="games"></div>
  <div class="join">
    <h3 class="disp">Playing on a phone?</h3>
    <input id="code" maxlength="4" placeholder="CODE" autocomplete="off" autocapitalize="characters" aria-label="Game code">
    <button class="btn" id="go">Join</button>
    <span class="muted">Type the 4-letter code from the big screen, or just scan its QR code.</span>
  </div>
</div>
<script>
/* ===== Add new games here — each one is its own .html file in this folder ===== */
const GAMES = [
  {
    file: 'jeopardy.html',
    title: 'Jeopardy!',
    art: '🟦',
    blurb: 'Pick a category, buzz in on your phone and type your answer. Then a Wager Round and a head-to-head “We asked 100 people” Final.',
    tags: ['2–8 teams', 'Phone buzzers', 'Read aloud', '1,500+ questions'],
    bg: 'linear-gradient(145deg,#1a32e0,#060f8f)',
    joinable: true
  },
  {
    file: 'familyfortunes.html',
    title: 'Family Fortunes',
    art: '💯',
    blurb: 'We asked 100 people… Two families face off, play or pass, three strikes and steal — then Big Money for 200 points.',
    tags: ['2 families', 'Phone buzzers', 'Read aloud', '400+ real surveys from the show'],
    bg: 'linear-gradient(145deg,#ff9f0a,#c24d00 55%,#5a1d00)',
    joinable: true
  }
  // { file:'next-game.html', title:'…', art:'🎲', blurb:'…', tags:['…'], bg:'linear-gradient(145deg,#…,#…)', joinable:false },
];

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.getElementById('games').innerHTML=GAMES.map(g=>`<a class="game" href="${esc(g.file)}" style="background:${g.bg}">
  <span class="play">Play ▸</span><div class="art">${g.art}</div><h2 class="disp">${esc(g.title)}</h2><p>${esc(g.blurb)}</p>
  <div class="tags">${g.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div></a>`).join('')+
  `<div class="game soon"><div class="art">➕</div><div class="disp" style="font-size:22px">More games coming soon</div></div>`;

// Any game's page can take the code: phones that land on the wrong game get sent to the right one automatically.
const joinGame=GAMES.find(g=>g.joinable);
const go=()=>{const v=document.getElementById('code').value.trim().toUpperCase();if(/^[A-Z]{4}$/.test(v)&&joinGame)location.href=joinGame.file+'?join='+v};
document.getElementById('go').onclick=go;
document.getElementById('code').onkeydown=e=>{if(e.key==='Enter')go()};
</script>
</body>
</html>
